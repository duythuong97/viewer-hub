# Checks every push; a tag v<version> also builds the Windows release zip and publishes it as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0      (the tag must equal viewer_hub.__version__)
#
# No secret is needed: default addons (addons/*.zip) are committed already signed; the premium signing key never
# leaves the author's machine. The python.org embeddable zip is downloaded here and checked against a pinned SHA-256.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_EMBED: python-3.12.10-embed-amd64.zip
  PYTHON_EMBED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: |
          uv sync --frozen
          npm ci --prefix web
      - name: Build web UI
        run: npm run build --prefix web
      - name: Tests and security rules
        run: |
          uv run pytest -q
          uv run python packaging/check_security.py
          npm run test:codemap --prefix web
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run python -c "import viewer_hub; print(viewer_hub.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$version"; exit 1; }
      - name: python.org embeddable Python
        run: |
          curl -fsSL -o "packaging/$PYTHON_EMBED" "https://www.python.org/ftp/python/3.12.10/$PYTHON_EMBED"
          echo "$PYTHON_EMBED_SHA256  packaging/$PYTHON_EMBED" | sha256sum -c -
      - name: Build release zip
        run: uv run python packaging/build.py --skip-web
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/ViewerHub-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # The release runs on Windows with python.org's Python: prove the vendored pure-Python packages import and the CLI
  # starts there, before anyone downloads it.
  windows-smoke:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Unpack and run
        shell: pwsh
        run: |
          $zip = Get-ChildItem ViewerHub-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath rel
          $root = Get-ChildItem rel -Directory | Select-Object -First 1
          & "$($root.FullName)\python\python.exe" -I -c "import yaml, markupsafe, chardet, charset_normalizer, flask, waitress, mkdocs.commands.build, material"
          if ($LASTEXITCODE) { exit 1 }
          & "$($root.FullName)\python\python.exe" -I -m viewer_hub --version
          if ($LASTEXITCODE) { exit 1 }
          # `just unlock` derives its key with scrypt: the embeddable Python's OpenSSL must have it
          & "$($root.FullName)\python\python.exe" -I -c "from viewer_hub.core import unlock; assert len(unlock.derive('smoke test passphrase')) == 32"
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory "$($root.FullName)\input\csv" | Out-Null
          Set-Content "$($root.FullName)\input\csv\demo.csv" "ma,ten`n1,Thử nghiệm" -Encoding utf8
          Push-Location $root.FullName
          & .\python\python.exe -I -m viewer_hub --data-dir "$env:RUNNER_TEMP\vh" pack --input input --out dist
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          Get-ChildItem "$($root.FullName)\dist\*.sapack"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ViewerHub-*.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Viewer Hub ${GITHUB_REF_NAME#v}" --generate-notes
